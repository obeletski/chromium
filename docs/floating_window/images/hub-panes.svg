<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img"
     aria-label="Schematic of the four Hub panes: Tabs, Groups, Sync and History">
  <style>
    .frame { fill: none; stroke: #9aa0a6; stroke-width: 1.5; rx: 10; }
    .bar   { fill: #e8eaed; }
    .chip  { fill: #ffffff; stroke: #9aa0a6; stroke-width: 1; }
    .chipOn{ fill: #1a73e8; }
    .thumb { fill: #dadce0; stroke: #bdc1c6; stroke-width: 1; }
    .row   { fill: #f1f3f4; stroke: #dadce0; stroke-width: 1; }
    .t     { font-size: 11px; fill: #202124; }
    .tsm   { font-size: 9.5px; fill: #5f6368; }
    .ttl   { font-size: 12.5px; font-weight: 600; fill: #202124; }
    .cap   { font-size: 10.5px; fill: #5f6368; }
    .num   { font-size: 10px; font-weight: 700; fill: #1a73e8; }
  </style>

  <text x="8" y="16" class="ttl">The four Hub panes a tab summary could attach to</text>
  <text x="8" y="31" class="cap">Each pane supplies its own root view (Pane.getRootView); HubPaneHostMediator swaps it into the host. Shown in display order.</text>

  <!-- ============ 1. TAB_SWITCHER ============ -->
  <g transform="translate(8,46)">
    <rect class="frame" width="200" height="330"/>
    <rect class="bar" x="1" y="1" width="198" height="26" rx="9"/>
    <text x="10" y="18" class="t">✕</text><text x="80" y="18" class="t">Tabs</text><text x="182" y="18" class="t">⋮</text>
    <rect class="chipOn" x="10" y="34" width="44" height="16" rx="8"/>
    <text x="18" y="46" class="tsm" fill="#fff">Tabs</text>
    <rect class="chip" x="60" y="34" width="46" height="16" rx="8"/><text x="67" y="46" class="tsm">Groups</text>
    <rect class="chip" x="112" y="34" width="36" height="16" rx="8"/><text x="120" y="46" class="tsm">Sync</text>
    <rect class="chip" x="154" y="34" width="38" height="16" rx="8"/><text x="160" y="46" class="tsm">Hist.</text>

    <rect class="thumb" x="12" y="60" width="84" height="66" rx="6"/>
    <rect class="thumb" x="104" y="60" width="84" height="66" rx="6"/>
    <rect class="thumb" x="12" y="134" width="84" height="66" rx="6"/>
    <rect class="thumb" x="104" y="134" width="84" height="66" rx="6"/>
    <rect class="thumb" x="12" y="208" width="84" height="66" rx="6"/>
    <rect class="thumb" x="104" y="208" width="84" height="66" rx="6"/>
    <text x="100" y="300" class="cap" text-anchor="middle">grid of tab thumbnails</text>
    <text x="100" y="316" class="num" text-anchor="middle">PaneId.TAB_SWITCHER</text>
  </g>

  <!-- ============ 2. TAB_GROUPS ============ -->
  <g transform="translate(228,46)">
    <rect class="frame" width="200" height="330"/>
    <rect class="bar" x="1" y="1" width="198" height="26" rx="9"/>
    <text x="10" y="18" class="t">✕</text><text x="72" y="18" class="t">Groups</text><text x="182" y="18" class="t">⋮</text>
    <rect class="chip" x="10" y="34" width="44" height="16" rx="8"/><text x="18" y="46" class="tsm">Tabs</text>
    <rect class="chipOn" x="60" y="34" width="46" height="16" rx="8"/>
    <text x="67" y="46" class="tsm" fill="#fff">Groups</text>
    <rect class="chip" x="112" y="34" width="36" height="16" rx="8"/><text x="120" y="46" class="tsm">Sync</text>
    <rect class="chip" x="154" y="34" width="38" height="16" rx="8"/><text x="160" y="46" class="tsm">Hist.</text>

    <rect class="row" x="12" y="60" width="176" height="54" rx="6"/>
    <circle cx="24" cy="74" r="5" fill="#1a73e8"/><text x="36" y="78" class="t">Rust</text>
    <text x="160" y="78" class="tsm">4 tabs</text>
    <rect class="thumb" x="22" y="86" width="34" height="20" rx="3"/>
    <rect class="thumb" x="60" y="86" width="34" height="20" rx="3"/>
    <rect class="thumb" x="98" y="86" width="34" height="20" rx="3"/>

    <rect class="row" x="12" y="122" width="176" height="54" rx="6"/>
    <circle cx="24" cy="136" r="5" fill="#e8710a"/><text x="36" y="140" class="t">Baking</text>
    <text x="160" y="140" class="tsm">3 tabs</text>
    <rect class="thumb" x="22" y="148" width="34" height="20" rx="3"/>
    <rect class="thumb" x="60" y="148" width="34" height="20" rx="3"/>

    <rect class="row" x="12" y="184" width="176" height="54" rx="6"/>
    <circle cx="24" cy="198" r="5" fill="#188038"/><text x="36" y="202" class="t">News</text>
    <text x="160" y="202" class="tsm">2 tabs</text>
    <rect class="thumb" x="22" y="210" width="34" height="20" rx="3"/>

    <text x="100" y="300" class="cap" text-anchor="middle">list of tab groups</text>
    <text x="100" y="316" class="num" text-anchor="middle">PaneId.TAB_GROUPS</text>
  </g>

  <!-- ============ 3. CROSS_DEVICE ============ -->
  <g transform="translate(448,46)">
    <rect class="frame" width="200" height="330"/>
    <rect class="bar" x="1" y="1" width="198" height="26" rx="9"/>
    <text x="10" y="18" class="t">✕</text><text x="78" y="18" class="t">Sync</text><text x="182" y="18" class="t">⋮</text>
    <rect class="chip" x="10" y="34" width="44" height="16" rx="8"/><text x="18" y="46" class="tsm">Tabs</text>
    <rect class="chip" x="60" y="34" width="46" height="16" rx="8"/><text x="67" y="46" class="tsm">Groups</text>
    <rect class="chipOn" x="112" y="34" width="36" height="16" rx="8"/>
    <text x="120" y="46" class="tsm" fill="#fff">Sync</text>
    <rect class="chip" x="154" y="34" width="38" height="16" rx="8"/><text x="160" y="46" class="tsm">Hist.</text>

    <text x="14" y="74" class="tsm">▾  Laptop · 2 min ago</text>
    <rect class="row" x="12" y="82" width="176" height="22" rx="4"/><text x="20" y="97" class="t">Ownership and borrowing</text>
    <rect class="row" x="12" y="108" width="176" height="22" rx="4"/><text x="20" y="123" class="t">Lifetimes</text>

    <text x="14" y="150" class="tsm">▾  Tablet · yesterday</text>
    <rect class="row" x="12" y="158" width="176" height="22" rx="4"/><text x="20" y="173" class="t">Sourdough starter</text>
    <rect class="row" x="12" y="184" width="176" height="22" rx="4"/><text x="20" y="199" class="t">Hydration ratios</text>

    <text x="100" y="300" class="cap" text-anchor="middle">tabs from other devices</text>
    <text x="100" y="316" class="num" text-anchor="middle">PaneId.CROSS_DEVICE</text>
  </g>

  <!-- ============ 4. HISTORY ============ -->
  <g transform="translate(668,46)">
    <rect class="frame" width="200" height="330"/>
    <rect class="bar" x="1" y="1" width="198" height="26" rx="9"/>
    <text x="10" y="18" class="t">✕</text><text x="70" y="18" class="t">History</text><text x="182" y="18" class="t">⋮</text>
    <rect class="chip" x="10" y="34" width="44" height="16" rx="8"/><text x="18" y="46" class="tsm">Tabs</text>
    <rect class="chip" x="60" y="34" width="46" height="16" rx="8"/><text x="67" y="46" class="tsm">Groups</text>
    <rect class="chip" x="112" y="34" width="36" height="16" rx="8"/><text x="120" y="46" class="tsm">Sync</text>
    <rect class="chipOn" x="154" y="34" width="38" height="16" rx="8"/>
    <text x="160" y="46" class="tsm" fill="#fff">Hist.</text>

    <rect class="row" x="12" y="60" width="176" height="20" rx="4" fill="#fff"/>
    <!-- Magnifier drawn, not the U+1F50D emoji: no emoji font is present in
         the headless Chrome that renders these docs, so the glyph came out
         as a tofu box. -->
    <circle cx="23" cy="68.5" r="4" fill="none" stroke="#5f6368" stroke-width="1.3"/>
    <line x1="26" y1="71.5" x2="29" y2="74.5" stroke="#5f6368" stroke-width="1.3" stroke-linecap="round"/>
    <text x="35" y="74" class="tsm">Search history</text>

    <text x="14" y="98" class="tsm">Today</text>
    <rect class="row" x="12" y="104" width="176" height="22" rx="4"/><text x="20" y="119" class="t">The Rust Book</text>
    <rect class="row" x="12" y="130" width="176" height="22" rx="4"/><text x="20" y="145" class="t">Lifetimes — Rust</text>
    <rect class="row" x="12" y="156" width="176" height="22" rx="4"/><text x="20" y="171" class="t">Sourdough guide</text>

    <text x="14" y="196" class="tsm">Yesterday</text>
    <rect class="row" x="12" y="202" width="176" height="22" rx="4"/><text x="20" y="217" class="t">Hydration ratios</text>

    <text x="100" y="300" class="cap" text-anchor="middle">browsing history list</text>
    <text x="100" y="316" class="num" text-anchor="middle">PaneId.HISTORY</text>
  </g>

  <text x="8" y="396" class="cap">Schematic, not a screenshot: drawn from the pane structure in the source. Spacing, iconography and Material styling are illustrative only.</text>
  <text x="8" y="412" class="cap">INCOGNITO_TAB_SWITCHER and BOOKMARKS are also panes; omitted here because neither is a candidate surface for the summary.</text>
</svg>
